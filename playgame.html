<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#020817">

<title>Game Play - Benihtoto</title>
<link rel="icon" type="image/png" href="https://www.image2url.com/r2/default/images/1787124087110-1ca2521d-6907-46bb-be19-8632dccbbdb8.png">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#020817;
  --bg2:#061a3a;
  --blue:#18a8ff;
  --blue2:#006cff;
  --cyan:#51e8ff;
  --text:#f5fbff;
  --muted:#91a9c8;
  --line:rgba(108,190,255,.20);
  --shadow:0 18px 55px rgba(0,70,180,.30);
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(0,132,255,.22),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 35%,
      rgba(0,229,255,.13),
      transparent 27%
    ),
    linear-gradient(
      180deg,
      #020817 0%,
      #03142e 45%,
      #020817 100%
    );

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  min-height:100vh;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
  width:min(100%,520px);
  min-height:100vh;

  margin:auto;

  position:relative;
  overflow:hidden;

  background:
  linear-gradient(
    180deg,
    #051c41 0%,
    #03142e 45%,
    #020817 100%
  );
    radial-gradient(
      circle at 50% 20%,
      rgba(24,168,255,.10),
      transparent 35%
    );

  box-shadow:
    0 0 80px rgba(0,119,255,.12);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:fixed;

  z-index:50;

  top:0;
  left:50%;

  transform:translateX(-50%);

  width:min(100%,520px);
  height:42px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 14px;

  background:
    linear-gradient(
      180deg,
      rgba(2,12,31,.92),
      rgba(2,12,31,.45),
      transparent
    );

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.brand-dot{
  width:36px;
  height:36px;

  border-radius:12px;

  display:grid;
  place-items:center;

  font-weight:900;
  font-size:14px;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--blue2)
    );

  box-shadow:
    0 0 25px rgba(24,168,255,.45);
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:38px;
  height:38px;

  border:1px solid rgba(145,215,255,.22);
  border-radius:12px;

  background:rgba(4,25,57,.62);
  color:white;

  display:grid;
  place-items:center;

  cursor:pointer;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}


/* =========================================================
   COVER
========================================================= */

.cover{
  aspect-ratio:16/9;

  position:relative;
  overflow:hidden;

  background:#031936;
}

.cover img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.cover::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.04) 45%,
      rgba(1,8,22,.82) 100%
    );

  pointer-events:none;
}

.cover-title{
  position:absolute;

  z-index:2;

  left:16px;
  right:16px;

  font-size:13px;
  font-weight:800;

  letter-spacing:.7px;

  text-shadow:
    0 2px 14px #000;
}


/* =========================================================
   PROFILE
========================================================= */

.profile{
  padding:0 16px 12px;

  position:relative;
}

.avatar{
  width:88px;
  height:88px;

  border-radius:50%;

  border:4px solid #061a3a;

  position:relative;

  margin-top:-44px;

  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      #0fd8ff,
      #0756ff
    );

  box-shadow:
    0 8px 28px rgba(0,0,0,.4),
    0 0 0 1px rgba(110,210,255,.28);
}

.online{
  position:absolute;

  left:80px;
  top:30px;

  width:15px;
  height:15px;

  border-radius:50%;

  background:#24ff8a;

  border:3px solid #061a3a;

  box-shadow:
    0 0 15px #24ff8a;
}

.name-row{
  display:flex;
  align-items:center;
  gap:8px;

  margin-top:8px;
}

.name{
  font-size:21px;
  font-weight:900;
}

.verified{
  width:19px;
  height:19px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #36ddff,
      #0074ff
    );

  font-size:11px;
  font-weight:900;
}

.username{
  font-size:12px;

  color:var(--muted);

  margin-top:2px;
}

.stats{
  display:flex;

  gap:17px;

  font-size:12px;
  font-weight:800;

  margin:12px 0;
}

.stats span{
  color:#dceeff;
}

.stats small{
  color:var(--muted);
  font-weight:600;
}


/* =========================================================
   LONG MENU
========================================================= */

.long-menu{
  position:relative;

  display:block;

  width:100%;
  height:60px;

  border:1px solid rgba(83,201,255,.30);

  border-radius:12px;

  background:
    linear-gradient(
      100deg,
      rgba(0,92,255,.25),
      rgba(0,214,255,.13)
    ),
    rgba(3,25,58,.75);

  box-shadow:var(--shadow);

  overflow:hidden;

  animation:floatPulse 2.8s ease-in-out infinite;
}

.long-menu::before{
  content:"";

  position:absolute;

  inset:-100% 30%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  transform:rotate(20deg);

  animation:shine 3.5s linear infinite;
}

.long-menu .content{
  position:relative;

  display:block;

  width:100%;
  height:60px;

  z-index:1;
}


/* GIF */

/* =========================================================
   GIF BANNER FULL
========================================================= */

.gif-badge{
  width:100%;
  height:60px;

  border-radius:12px;

  overflow:hidden;

  flex-shrink:0;

  background:#061a3a;

  box-shadow:
    0 0 22px rgba(38,196,255,.30);

  position:relative;

  z-index:2;
}

.gif-badge img{
  width:100%;
  height:60px;

  display:block;

  object-fit:fill;

  object-position:center;

  margin:0;
  padding:0;
}

.long-text strong{
  display:block;

  font-size:14px;
}

.long-text span{
  display:block;

  font-size:10px;

  color:#a9d8ff;

  margin-top:2px;
}


/* =========================================================
   AUTH - DAFTAR / MAIN
========================================================= */

.auth-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:12px 0 18px;
}

.auth{
  flex:1;
  max-width:240px;

  height:38px;
  padding:0 10px;

  border:none;
  border-radius:7px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;

  color:#fff;

  font-weight:900;
  font-size:14px;

  position:relative;
  overflow:hidden;

  text-decoration:none;

  background:linear-gradient(90deg,#0b00a3,#0090ff);

  box-shadow:0 0 10px #0090ff;

  animation:
    authFloat 2.5s ease-in-out infinite,
    authGlow 2s infinite;
}


/* MAIN MERAH */

.auth.login{
  background:linear-gradient(90deg,#ff0000,#800000);

  box-shadow:0 0 10px #ff0000;

  animation:
    authFloat 2.5s ease-in-out infinite,
    authGlowMain 2s infinite;
}


/* DAFTAR BIRU */

.auth.register{
  background:linear-gradient(90deg,#0b00a3,#0090ff);

  box-shadow:0 0 10px #0090ff;
}


/* NAIK TURUN */

@keyframes authFloat{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-4px);
  }

  100%{
    transform:translateY(0);
  }

}


/* GLOW DAFTAR */

@keyframes authGlow{

  0%{
    box-shadow:0 0 8px rgba(255,255,255,.5);
  }

  50%{
    box-shadow:0 0 18px rgb(0,144,255);
  }

  100%{
    box-shadow:0 0 8px rgba(255,255,255,.5);
  }

}


/* GLOW MAIN */

@keyframes authGlowMain{

  0%{
    box-shadow:0 0 8px rgba(255,255,255,.5);
  }

  50%{
    box-shadow:0 0 18px rgb(255,0,0);
  }

  100%{
    box-shadow:0 0 8px rgba(255,255,255,.5);
  }

}


/* EFEK CAHAYA BERJALAN */

.auth::after{

  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:50%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.4),
    transparent
  );

  transform:skewX(-20deg);

  animation:authShine 3s infinite;

  pointer-events:none;
}


@keyframes authShine{

  0%{
    left:-100%;
  }

  100%{
    left:150%;
  }

}


/* HOVER PC */

.auth:hover{
  transform:translateY(-2px);
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;

  gap:28px;

  border-bottom:
    1px solid rgba(110,180,255,.12);

  padding:0 16px;
}

.tab{
  padding:12px 0 11px;

  font-size:13px;
  font-weight:900;

  color:#7894b7;

  position:relative;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:-1px;

  height:3px;

  border-radius:5px;

  background:
    linear-gradient(
      90deg,
      #00d5ff,
      #0068ff
    );

  box-shadow:
    0 0 12px rgba(0,181,255,.7);
}


/* =========================================================
   FEED
========================================================= */

.feed{
  padding:12px 10px 100px;
}

.video-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}


/* =========================================================
   VIDEO CARD
========================================================= */

.video-card{
  min-width:0;

  position:relative;

  border-radius:14px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #0a3b7d,
      #061f48
    );

  border:
    1px solid rgba(85,188,255,.20);

  box-shadow:
    0 8px 25px rgba(0,0,0,.28);

  animation:
    cardIn .65s both;
}

.video-card:nth-child(2){
  animation-delay:.08s;
}

.video-card:nth-child(3){
  animation-delay:.16s;
}

.video-card:nth-child(4){
  animation-delay:.24s;
}


/* =========================================================
   VIDEO WRAP
========================================================= */

.video-wrap{
  position:relative;

  aspect-ratio:1/1;

  overflow:hidden;

  background:#071a35;

  cursor:pointer;
}


/*
   PENTING:

   Tidak menggunakan poster.
   Video tetap 1:1.
   object-fit contain = video tidak kepotong.
*/

.video-wrap video{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  background:#071a35;

  outline:none;

  border:0;

  opacity:1;

  /*
     Video preview menggunakan muted autoplay.
     Ini membuat frame/video asli muncul,
     bukan kotak hitam/poster.
  */

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   LOADING VIDEO
========================================================= */

.video-wrap::before{
  content:"";

  position:absolute;

  z-index:1;

  left:50%;
  top:50%;

  width:25px;
  height:25px;

  margin:-12.5px 0 0 -12.5px;

  border-radius:50%;

  border:
    2px solid rgba(255,255,255,.18);

  border-top-color:#42d9ff;

  opacity:0;

  pointer-events:none;

  animation:spin .8s linear infinite;
}

.video-wrap.loading::before{
  opacity:1;
}


/* =========================================================
   PLAY BUTTON
========================================================= */

.play-btn{
  position:absolute;

  z-index:5;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:56px;
  height:56px;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.55);

  background:
    rgba(255,255,255,.08);

  color:white;

  display:grid;
  place-items:center;

  cursor:pointer;

  box-shadow:
    0 0 0 7px rgba(0,132,255,.10),
    0 8px 25px rgba(0,0,0,.38);

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);

  transition:.25s;
}

.play-btn:hover{
  transform:
    translate(-50%,-50%)
    scale(1.08);
}

.play-btn.hidden{
  opacity:0;

  pointer-events:none;
}

.play-icon{
  width:0;
  height:0;

  border-top:
    9px solid transparent;

  border-bottom:
    9px solid transparent;

  border-left:
    14px solid white;

  margin-left:3px;
}


/* =========================================================
   GAME TAG
========================================================= */

.game-tag{
  position:absolute;

  z-index:6;

  left:3px;
  top:3px;

  max-width:
    calc(100% - 14px);

  padding:5px 7px;

  border-radius:8px;

  background:
    rgba(0,19,50,.75);

  border:
    1px solid rgba(105,211,255,.32);

  font-size:8px;
  font-weight:1000;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}


/* =========================================================
   VIEWS
========================================================= */

.views{
  position:absolute;

  z-index:6;

  bottom:0px;

  display:flex;

  align-items:center;

  gap:4px;

  padding:4px 6px;

  border-radius:8px;

  background:
    rgba(0,0,0,.58);

  font-size:7px;
  font-weight:800;
}

.live-dot{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#35ff9b;

  box-shadow:
    0 0 8px #35ff9b;
}


/* =========================================================
   PLAY AREA
========================================================= */

.play-area{
  padding:7px;

  background:
    linear-gradient(
      180deg,
      rgba(4,38,83,.95),
      rgba(3,21,49,.98)
    );
}

/* =========================================================
   TOMBOL MAINKAN - STYLE LOGIN MERAH
========================================================= */

.play-link{
  width:100%;
  min-height:34px;

  border:0;
  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:5px;

  color:#fff;

  font-size:13px;
  font-weight:1000;

  letter-spacing:.3px;

  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #ff0000,
      #800000
    );

  box-shadow:
    0 0 10px #ff0000;

  animation:
    playLinkFloat 2.5s ease-in-out infinite,
    playLinkGlow 2s infinite;
}


/* NAIK TURUN */

@keyframes playLinkFloat{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }

  100%{
    transform:translateY(0);
  }

}


/* GLOW MERAH */

@keyframes playLinkGlow{

  0%{
    box-shadow:
      0 0 8px rgba(255,255,255,.5);
  }

  50%{
    box-shadow:
      0 0 18px rgb(255,0,0);
  }

  100%{
    box-shadow:
      0 0 8px rgba(255,255,255,.5);
  }

}


/* CAHAYA BERJALAN */

.play-link::after{

  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:50%;
  height:100%;

  background:
    linear-gradient(
      120deg,
      transparent,
      rgba(255,255,255,.4),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    playLinkShine 3s infinite;

  pointer-events:none;
}


@keyframes playLinkShine{

  0%{
    left:-100%;
  }

  100%{
    left:150%;
  }

}


/* =========================================================
   FOCUS OVERLAY
========================================================= */

.focus-overlay{
  position:fixed;

  inset:0;

  z-index:200;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:16px;

  background:
    rgba(0,4,15,.88);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  opacity:0;

  visibility:hidden;

  pointer-events:none;

  transition:
    opacity .28s ease,
    visibility .28s ease;
}

.focus-overlay.show{
  opacity:1;

  visibility:visible;

  pointer-events:auto;
}

.focus-container{
  width:min(
    92vw,
    520px
  );

  aspect-ratio:1/1;

  position:relative;

  border-radius:20px;

  overflow:hidden;

  background:#000;

  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    0 0 45px rgba(0,132,255,.20);

  transform:
    scale(.82);

  opacity:0;

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    opacity .25s ease;
}

.focus-overlay.show .focus-container{
  transform:scale(1);

  opacity:1;
}

.focus-container video{
  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;

  display:block;

  outline:none;
}

.focus-close{
  position:absolute;

  z-index:20;

  right:12px;
  top:12px;

  width:38px;
  height:38px;

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:50%;

  background:
    rgba(0,0,0,.45);

  color:white;

  font-size:22px;

  display:grid;
  place-items:center;

  cursor:pointer;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
  position:fixed;

  z-index:40;

  bottom:0;
  left:50%;

  transform:translateX(-50%);

  width:min(100%,520px);

  height:61px;

  padding:
    0
    max(3px,env(safe-area-inset-left))
    max(2px,env(safe-area-inset-bottom))
    max(3px,env(safe-area-inset-right));

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:0;

  background:
    linear-gradient(
      180deg,
      rgba(7,39,69,.98),
      rgba(3,22,43,.99)
    );

  border-top:
    1px solid rgba(111,203,255,.28);

  box-shadow:
    0 -7px 24px rgba(0,0,0,.30);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav-item{
  position:relative;

  color:#e8f5ff;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  font-size:8px;
  font-weight:1000;

  border-right:
    1px solid rgba(2,15,29,.75);

  border-left:
    1px solid rgba(103,191,237,.08);

  transition:.2s;

  text-shadow:
    0 1px 3px rgba(0,0,0,.7);

  overflow:hidden;
}

.nav-item .nav-icon{
  position:relative;

  z-index:1;

  width:24px;
  height:24px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.nav-item .nav-icon img{
  width:22px;
  height:22px;

  object-fit:contain;

  display:block;
}

.nav-item span:last-child{
  position:relative;

  z-index:1;
}

.nav-item.active{
  color:#fff;

  background:
    rgba(12,105,158,.16);
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  z-index:300;

  left:50%;

  bottom:84px;

  transform:
    translate(-50%,18px);

  width:min(
    calc(100% - 30px),
    390px
  );

  padding:13px 15px;

  border-radius:14px;

  background:
    rgba(2,18,42,.95);

  border:
    1px solid rgba(73,191,255,.32);

  box-shadow:
    0 18px 50px rgba(0,0,0,.4);

  font-size:12px;
  font-weight:800;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  text-align:center;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  z-index:90;

  inset:0;

  display:grid;

  place-items:end center;

  padding:18px;

  background:
    rgba(0,6,18,.62);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.modal.show{
  opacity:1;

  pointer-events:auto;
}

.modal-box{
  width:min(100%,470px);

  border-radius:
    24px
    24px

/* =========================================================

const grid =

const videoElements =

let currentVideo =

let currentIndex =
  -1;

let previewVideo =
  null;


/* =========================================================
   FORMAT VIEWS
========================================================= */

function formatViews(number){

  return new Intl.NumberFormat(
    "id-ID",
    {
      notation:"compact",
      maximumFractionDigits:1
    }
  ).format(number);

}


/* =========================================================
   STOP CARD VIDEOS
========================================================= */

function stopAllCardVideos(except = null){

  videoElements.forEach(video => {

    if(video !== except){

      try{
        video.pause();
      }catch(error){}

    }

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   CREATE VIDEO CARDS
========================================================= */

CONFIG.videos
.slice(0,8)
.forEach((item,index)=>{

  const card =
    document.createElement("article");

  card.className =
    "video-card";


  card.innerHTML = `

    <div class="video-wrap">

      <video
        playsinline
        webkit-playsinline
        muted
        loop
        preload="none"
      ></video>


      <div class="game-tag">

      <button
        class="play-btn"
        type="button"
        aria-label="Putar ${escapeHTML(item.game)}"
      >

        <span class="play-icon"></span>

      </button>


      <div class="views">

        <span class="live-dot"></span>

        <span class="view-number">
          ${formatViews(item.startViews)}
        </span>

      </div>

    </div>


    <div class="play-area">

      <a
        class="play-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        ▶ MAINKAN
      </a>

    </div>

  `;


  grid.appendChild(card);


  const video =
    card.querySelector("video");

  const playBtn =
    card.querySelector(".play-btn");

  const videoWrap =
    card.querySelector(".video-wrap");

  const viewNumber =
    card.querySelector(".view-number");

  const playLink =
    card.querySelector(".play-link");


  /* =======================================================
     SIMPAN URL
  ======================================================== */

  video.dataset.src =
    item.video;


  playLink.href =
    item.playUrl;


  /* =======================================================
     VIDEO DEFAULT
  ======================================================== */

  video.muted =
    true;

  video.defaultMuted =
    true;

  video.volume =
    0;


  videoElements.push(video);


  let views =
    item.startViews;

  let counted =
    false;


  /* =======================================================
     LOAD VIDEO
  ======================================================== */

  function loadVideo(){

    if(
      video.getAttribute("src")
    ){
      return;
    }

    const src =
      video.dataset.src;

    if(!src){
      return;
    }

    videoWrap.classList.add(
      "loading"
    );

    video.src =
      src;

    try{
      video.load();
    }catch(error){}

  }


  /* =======================================================
     VIDEO READY
  ======================================================== */

  video.addEventListener(
    "loadeddata",
    ()=>{

      videoWrap.classList.remove(
        "loading"
      );

    }
  );


  video.addEventListener(
    "canplay",
    ()=>{

      videoWrap.classList.remove(
        "loading"
      );

    }
  );


  /* =======================================================
     VIDEO ERROR
  ======================================================== */

  video.addEventListener(
    "error",
    ()=>{

      videoWrap.classList.remove(
        "loading"
      );

      showToast(
        "Video gagal dimuat. Periksa link video."
      );

    }
  );


  /* =======================================================
     PREVIEW PLAY
  ======================================================== */

  async function startPreview(){

    loadVideo();

    video.muted =
      true;

    video.defaultMuted =
      true;

    video.volume =
      0;


    /*
       Hanya satu video preview yang aktif.
       Ini menghemat bandwidth.
    */

    if(
      previewVideo &&
      previewVideo !== video
    ){

      try{
        previewVideo.pause();
      }catch(error){}

    }


    previewVideo =
      video;


    try{

      await video.play();

    }catch(error){

      /*
         Browser tertentu bisa menolak autoplay.
         Video tetap akan bisa dimainkan melalui tombol.
      */

    }

  }


  /* =======================================================
     PAUSE PREVIEW
  ======================================================== */

  function stopPreview(){

    try{
      video.pause();
    }catch(error){}

  }


  /* =======================================================
     INTERSECTION OBSERVER
  ======================================================== */

  if(
    "IntersectionObserver"
    in window
  ){

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(
            entry => {

              if(
                entry.isIntersecting
              ){

                startPreview();

              }else{

                stopPreview();

              }

            }
          );

        },
        {
          root:null,

          /*
             Tidak terlalu jauh agar hemat data.
          */

          rootMargin:
            "100px 0px",

          threshold:
            0.15

        }
      );


    observer.observe(
      videoWrap
    );

  }else{

    startPreview();

  }


  /* =======================================================
     PLAY BUTTON
  ======================================================== */

  playBtn.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      openFocus(
        video,
        card,
        index
      );

    }
  );


  /* =======================================================
     CLICK VIDEO
  ======================================================== */

  videoWrap.addEventListener(
    "click",
    event => {

      if(
        event.target.closest(
          ".play-btn"
        )
      ){

        return;

      }

      openFocus(
        video,
        card,
        index
      );

    }
  );


  /* =======================================================
     CARD VIDEO PLAY
  ======================================================== */

  video.addEventListener(
    "play",
    ()=>{

      video.muted =
        true;

      video.defaultMuted =
        true;

      video.volume =
        0;

      playBtn.classList.add(
        "hidden"
      );

    }
  );


  /* =======================================================
     CARD VIDEO PAUSE
  ======================================================== */

  video.addEventListener(
    "pause",
    ()=>{

      playBtn.classList.remove(
        "hidden"
      );

    }
  );


  /* =======================================================
     COUNT VIEW
  ======================================================== */

  video.addEventListener(
    "play",
    ()=>{

      if(!counted){

        counted =
          true;

        views++;

        viewNumber.textContent =
          formatViews(views);

      }

    }
  );

});


/* =========================================================
   FOCUS ELEMENT
========================================================= */

const focusOverlay =
  $("focusOverlay");

const focusVideo =
  $("focusVideo");

const focusClose =
  $("focusClose");


focusVideo.muted =
  false;

focusVideo.defaultMuted =
  false;

focusVideo.volume =
  1;


/* =========================================================
   OPEN FOCUS
========================================================= */

async function openFocus(
  video,
  card,
  index
){

  /*
     Hentikan preview.
  */

  stopAllCardVideos();


  try{
    focusVideo.pause();
  }catch(error){}


  currentVideo =
    video;

  currentIndex =
    index;


  const src =
    video.dataset.src ||
    video.currentSrc ||
    video.src;


  if(!src){

    showToast(
      "Link video tidak ditemukan."
    );

    return;

  }


  /*
     Tampilkan overlay terlebih dahulu.
  */

  focusOverlay.classList.add(
    "show"
  );

  document.body.style.overflow =
    "hidden";


  /*
     Hanya ganti src kalau berbeda.
  */

  if(
    focusVideo.getAttribute("src")
    !== src
  ){

    try{
      focusVideo.pause();
    }catch(error){}

    focusVideo.src =
      src;

    try{
      focusVideo.load();
    }catch(error){}

  }


  focusVideo.muted =
    false;

  focusVideo.defaultMuted =
    false;

  focusVideo.volume =
    1;


  /*
     Putar dengan suara.
  */

  try{

    await focusVideo.play();

  }catch(error){

    /*
       Kalau browser memblokir suara,
       coba muted.
    */

    try{

      focusVideo.muted =
        true;

      focusVideo.defaultMuted =
        true;

      focusVideo.volume =
        0;

      await focusVideo.play();

      showToast(
        "Browser memblokir autoplay bersuara. Tap video untuk suara."
      );

    }catch(error2){

      showToast(
        "Video gagal diputar. Silakan coba lagi."
      );

    }

  }

}


/* =========================================================
   FOCUS VIDEO PLAY
========================================================= */

focusVideo.addEventListener(
  "play",
  ()=>{

    stopAllCardVideos();

  }
);


/* =========================================================
   FOCUS VIDEO CLICK
========================================================= */

focusVideo.addEventListener(
  "click",
  async ()=>{

    if(
      focusVideo.paused
    ){

      try{

        await focusVideo.play();

      }catch(error){

        try{

          focusVideo.muted =
            true;

          focusVideo.volume =
            0;

          await focusVideo.play();

        }catch(error2){}

      }

    }else{

      focusVideo.pause();

    }

  }
);


/* =========================================================
   CLOSE FOCUS
========================================================= */

function closeFocus(){

  if(
    !currentVideo
  ){

    focusOverlay.classList.remove(
      "show"
    );

    document.body.style.overflow =
      "";

    return;

  }


  let lastTime =
    0;


  try{

    lastTime =
      focusVideo.currentTime || 0;

  }catch(error){}


  try{

    focusVideo.pause();

  }catch(error){}


  focusOverlay.classList.remove(
    "show"
  );

  document.body.style.overflow =
    "";


  /*
     Kembalikan posisi waktu ke video card.
  */

  try{

    currentVideo.currentTime =
      lastTime;

  }catch(error){}


  currentVideo.muted =
    true;

  currentVideo.defaultMuted =
    true;

  currentVideo.volume =
    0;


  try{

    currentVideo.pause();

  }catch(error){}


  currentVideo =
    null;

  currentIndex =
    -1;

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

focusClose.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    closeFocus();

  }
);


/* =========================================================
   CLOSE CLICK BACKGROUND
========================================================= */

focusOverlay.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      focusOverlay
    ){

      closeFocus();

    }

  }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeFocus();

    }

  }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.hidden
    ){

      stopAllCardVideos();

      try{
        focusVideo.pause();
      }catch(error){}

    }

  }
);


/* =========================================================
   LIVECHAT
========================================================= */

$("navLivechat")
.addEventListener(
  "click",
  event => {

    event.preventDefault();


    $("modalTitle").textContent =
      "LIVECHAT";

    $("modalText").textContent =
      "Klik tombol di bawah untuk membuka Livechat.";

    $("modalAction").href =
      CONFIG.links.livechat;


    $("modal")
    .classList.add(
      "show"
    );

  }
);


/* =========================================================
   CLOSE MODAL
========================================================= */

$("closeModal")
.addEventListener(
  "click",
  ()=>{

    $("modal")
    .classList.remove(
      "show"
    );

  }
);


$("modal")
.addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("modal")
    ){

      $("modal")
      .classList.remove(
        "show"
      );

    }

  }
);


/* =========================================================
   SHARE
========================================================= */

$("shareBtn")
.addEventListener(
  "click",
  async ()=>{

    try{

      if(
        navigator.share
      ){

        await navigator.share({

          title:
            CONFIG.profile.name,

          text:
            "Lihat profil dan video terbaru.",

          url:
            location.href

        });

      }else{

        if(
          navigator.clipboard
        ){

          await navigator.clipboard
            .writeText(
              location.href
            );

          showToast(
            "Link halaman berhasil disalin."
          );

        }else{

          showToast(
            "Browser tidak mendukung salin otomatis."
          );

        }

      }

    }catch(error){

      /*
         User menekan cancel share.
         Tidak perlu menampilkan error.
      */

    }

  }
);


/* =========================================================
   MORE MENU
========================================================= */

$("moreBtn")
.addEventListener(
  "click",
  ()=>{

    showToast(
      "Menu dapat diubah melalui bagian CONFIG."
    );

  }
);


/* =========================================================
   ONLINE COUNTER
========================================================= */

let online =
  7;


setInterval(
  ()=>{

    online +=
      Math.random() > .5
      ? 1
      : -1;


    online =
      Math.max(
        3,
        Math.min(
          18,
          online
        )
      );


    document.title =
      `${online} orang sedang melihat • ${CONFIG.profile.name}`;

  },
  4200
);


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  const toast =
    $("toast");


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      ()=>{

        toast.classList.remove(
          "show"
        );

      },
      2600
    );

}

</script>
